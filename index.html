/* =========================================================

========================================================= */
function formatMoney(man){
  man = Math.round(man);
  const neg = man < 0;
  man = Math.abs(man);
  const oku = Math.floor(man / 10000);
  const rem = man % 10000;
  let s;
  if (oku > 0 && rem > 0) s = `${oku}億${rem.toLocaleString()}万円`;
  else if (oku > 0) s = `${oku}億円`;
  else s = `${rem.toLocaleString()}万円`;
  return (neg ? "-" : "") + s;
}
function formatDelta(man){
  const sign = man > 0 ? "+" : (man < 0 ? "-" : "±");
  return sign + formatMoney(Math.abs(man)).replace(/^-/, "");
}
function rand(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function toast(msg, kind){
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast px-4 py-2 rounded-lg shadow-lg text-sm font-bold " +
    (kind === "error" ? "bg-rose-600 text-white" : kind === "warn" ? "bg-amber-500 text-slate-900" : "bg-emerald-500 text-slate-900");
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

    resultsData: null,

    updatedAt: null,
  };
}
let state = defaultState();
let draftedSet = new Set();
function syncDraftedSet(){ draftedSet = new Set(state.draftedIds); }

/* =========================================================
   セーブ／ロード
========================================================= */
function serializeState(){
  const s = { ...state };
  delete s.builderPickingSlot;
  return JSON.stringify({
    mode: s.mode, aiType: s.aiType, saveSlot: s.saveSlot, round: s.round,
    playerRoster: mapRosterIds(s.playerRoster), aiRoster: mapRosterIds(s.aiRoster),
    playerBudgetUsed: s.playerBudgetUsed, aiBudgetUsed: s.aiBudgetUsed,
    draftedIds: s.draftedIds, freeTexts: s.freeTexts, battingOrder: s.battingOrder,
    screen: (s.screen === "waiver" ? "draft" : s.screen),
    resultsData: s.resultsData,
    updatedAt: Date.now(),
  });
}
function mapRosterIds(roster){
  const r = {};
  ALL_SLOT_KEYS.forEach(k => r[k] = roster[k] ? roster[k].id : null);
  return r;
}
function unmapRosterIds(roster){
  const r = {};
  ALL_SLOT_KEYS.forEach(k => r[k] = (roster && roster[k] != null) ? (PLAYERS_BY_ID[roster[k]] || null) : null);
  return r;
}
function saveGame(slot, silent){
  try{
    state.saveSlot = slot;
    localStorage.setItem(SAVE_PREFIX + slot, serializeState());
    if (!silent) toast(`スロット${slot}に保存しました`);
  }catch(e){ toast("保存に失敗しました", "error"); }
}
function loadGameRaw(slot){
  try{
    const raw = localStorage.getItem(SAVE_PREFIX + slot);
    if (!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function loadGame(slot){
  const data = loadGameRaw(slot);
  if (!data){ toast("保存データがありません", "error"); return; }
  state = defaultState();
  state.mode = data.mode; state.aiType = data.aiType; state.saveSlot = slot;
  state.round = data.round || 1;
  state.playerRoster = unmapRosterIds(data.playerRoster || {});
  state.aiRoster = unmapRosterIds(data.aiRoster || {});
  state.playerBudgetUsed = data.playerBudgetUsed || 0;
  state.aiBudgetUsed = data.aiBudgetUsed || 0;
  state.draftedIds = data.draftedIds || [];
  state.freeTexts = data.freeTexts || {};
  state.battingOrder = data.battingOrder || null;
  state.resultsData = data.resultsData || null;
  state.screen = data.screen || "home";
  syncDraftedSet();
  render();
  toast(`スロット${slot}から再開しました`);
}
function deleteSave(slot){
  localStorage.removeItem(SAVE_PREFIX + slot);
  render();
}
function listSaveSummaries(){
  const list = [];
  for (let i=1; i<=SAVE_SLOT_COUNT; i++){
    const data = loadGameRaw(i);
    list.push({ slot:i, data });
  }
  return list;
}

}

/* =========================================================
   ドラフトエンジン（モード①②：同時指名＋ウェーバー）
========================================================= */
function candidatePoolFor(slot, excludeIds){
  return PLAYERS.filter(p => p.pos === slot.pos && p.bestPos.includes(slot.bestPos) && !excludeIds.has(p.id));
}
function minRemainingCostFrom(startRoundIdx, excludeIds){
  let total = 0;
  for (let r = startRoundIdx; r <= 12; r++){
    const slot = ROUND_SLOTS[r-1];
    const pool = candidatePoolFor(slot, excludeIds);
    if (pool.length === 0) return Infinity;
    total += Math.min(...pool.map(p => p.salary_current));
  }
  return total;
}

function aiScore(aiType, p, aiRoster){
  const salary = p.salary_current;
  const jitter = rand(-8, 8);
  if (aiType === "data"){
    // 2,000万〜5,000万円帯を中心に、そこから離れるほど評価が下がる
    let score = 100 - Math.abs(salary - 3500) / 45;
    if (salary >= 2000 && salary <= 5000) score += 20;
    return score + jitter;
  }
  if (aiType === "roman"){
    // 1,000万〜2,000万円未満の超格安選手を最優先
    let score = salary < 2000 ? (100 - salary / 25) : (60 - salary / 400);
    return score + jitter;
  }
  if (aiType === "star"){
    const starsSoFar = Object.values(aiRoster).filter(x => x && x.salary_current >= 30000).length;
    if (salary >= 30000 && salary <= 50000 && starsSoFar < 2) return 130 + jitter;
    if (salary < 3000) return 90 + jitter;
    return 40 - salary / 3000 + jitter;
  }
  return 50 + jitter;
}

function aiChoose(slot, excludeIds){
  const budgetRemain = BUDGET - state.aiBudgetUsed;
  let pool = candidatePoolFor(slot, excludeIds).filter(p => p.salary_current <= budgetRemain);
  // 予算破綻を避けるため、この後の巡を編成しきれる選手のみに絞る
  const feasible = pool.filter(p => {
    const nextExclude = new Set(excludeIds); nextExclude.add(p.id);
    const remainAfter = budgetRemain - p.salary_current;
    return minRemainingCostFrom(slot.round + 1, nextExclude) <= remainAfter;
  });
  if (feasible.length > 0) pool = feasible;
  if (pool.length === 0){
    // フォールバック：最安の選手を強制選択（理論上到達しない保険）
    const all = candidatePoolFor(slot, excludeIds).sort((a,b) => a.salary_current - b.salary_current);
    return all[0] ? all[0].id : null;
  }
  const scored = pool.map(p => ({ p, score: aiScore(state.aiType, p, state.aiRoster) }));
  scored.sort((a,b) => b.score - a.score);
  const top = scored.slice(0, Math.min(3, scored.length));
  const weights = [0.6, 0.25, 0.15];
  const r = Math.random();
  let acc = 0, chosen = top[0];
  for (let i=0; i<top.length; i++){ acc += weights[i] || 0; if (r <= acc){ chosen = top[i]; break; } }
  return chosen.p.id;
}

function lockPlayerPick(slot, id){
  const p = PLAYERS_BY_ID[id];
  state.playerRoster[slot.slotKey] = p;
  state.playerBudgetUsed += p.salary_current;
  state.draftedIds.push(id); syncDraftedSet();
  state.roundPlayerLocked = true;
  if (state.mode === "pennant" && state.freeTextDraft && state.freeTextDraft.trim()){
    state.freeTexts[id] = state.freeTextDraft.trim();
  }
  state.freeTextDraft = "";
}
function lockAiPick(slot, id){
  const p = PLAYERS_BY_ID[id];
  state.aiRoster[slot.slotKey] = p;
  state.aiBudgetUsed += p.salary_current;
  state.draftedIds.push(id); syncDraftedSet();
  state.roundAiLocked = true;
}

function selectCandidate(id){
  if (state.roundPlayerLocked) return;
  const p = PLAYERS_BY_ID[id];
  const remain = BUDGET - state.playerBudgetUsed;
  if (p.salary_current > remain){ toast("予算が不足しています", "error"); return; }
  state.pendingPick = id;
  render();
}

function confirmPick(){
  if (state.roundPlayerLocked || !state.pendingPick) return;
  const slot = ROUND_SLOTS[state.round - 1];
  const playerPickId = state.pendingPick;

  if (!state.roundAiLocked){
    const excludeIds = new Set(draftedSet);
    const aiPickId = aiChoose(slot, excludeIds);
    if (aiPickId != null && aiPickId === playerPickId){
      runWaiver(slot, playerPickId);
      return;
    }
    if (aiPickId != null) lockAiPick(slot, aiPickId);
  }
  lockPlayerPick(slot, playerPickId);
  state.pendingPick = null;
  proceedIfBothLocked();
}

function runWaiver(slot, contestedId){
  state.waiver = { contestedId, phase: "spinning" };
  render();
  setTimeout(() => {
    const playerWins = Math.random() < 0.5;
    state.waiver.phase = "result";
    state.waiver.winner = playerWins ? "player" : "ai";
    if (playerWins){
      lockPlayerPick(slot, contestedId);
      const excludeIds = new Set(draftedSet);
      const aiPickId = aiChoose(slot, excludeIds);
      if (aiPickId != null) lockAiPick(slot, aiPickId);
    } else {
      lockAiPick(slot, contestedId);
      state.pendingPick = null;
    }
    render();
    setTimeout(() => {
      state.waiver = null;
      state.pendingPick = null;
      proceedIfBothLocked();
    }, 1500);
  }, 1400);
}

function proceedIfBothLocked(){
  if (state.roundPlayerLocked && state.roundAiLocked){
    const slot = ROUND_SLOTS[state.round - 1];
    state.roundReveal = { playerId: state.playerRoster[slot.slotKey].id, aiId: state.aiRoster[slot.slotKey].id };
    saveGame(state.saveSlot, true);
  }
  render();
}

function advanceRound(){
  if (state.round >= 12){
    state.screen = "order";
    state.battingOrder = null;
    saveGame(state.saveSlot, true);
    render();
    return;
  }
  state.round += 1;
  state.roundPlayerLocked = false;
  state.roundAiLocked = false;
  state.roundReveal = null;
  state.pendingPick = null;
  render();
}

/* =========================================================
   モード③：リアルタイム予想ビルダー（AI対戦なし、自由編成）
========================================================= */
function builderAssignedIds(){
  return new Set(Object.values(state.playerRoster).filter(Boolean).map(p => p.id));
}
function assignBuilderPlayer(slotKey, playerId){
  const slot = SLOT_BY_KEY[slotKey];
  const p = PLAYERS_BY_ID[playerId];
  if (!p || p.pos !== slot.pos || !p.bestPos.includes(slot.bestPos)){ toast("このスロットには指名できません", "error"); return; }
  const prev = state.playerRoster[slotKey];
  const usedWithoutSlot = state.playerBudgetUsed - (prev ? prev.salary_current : 0);
  if (usedWithoutSlot + p.salary_current > BUDGET){ toast("予算が不足しています", "error"); return; }
  state.playerRoster[slotKey] = p;
  state.playerBudgetUsed = usedWithoutSlot + p.salary_current;
  state.builderPickingSlot = null;
  state.battingOrder = null;
  saveGame(state.saveSlot, true);
  render();
}
function unassignBuilderSlot(slotKey){
  const prev = state.playerRoster[slotKey];
  if (!prev) return;
  state.playerBudgetUsed -= prev.salary_current;
  state.playerRoster[slotKey] = null;
  state.battingOrder = null;
  saveGame(state.saveSlot, true);
  render();
}

function renderBuilder(){
  const pickingSlotKey = state.builderPickingSlot;
  const assignedIds = builderAssignedIds();
  const filledCount = Object.values(state.playerRoster).filter(Boolean).length;

  let pickerBlock = "";
  if (pickingSlotKey){
    const slot = SLOT_BY_KEY[pickingSlotKey];
    const pool = PLAYERS.filter(p => p.pos === slot.pos && p.bestPos.includes(slot.bestPos) && !assignedIds.has(p.id))
      .sort((a,b) => a.salary_current - b.salary_current);
    const prev = state.playerRoster[pickingSlotKey];
    const usedWithoutSlot = state.playerBudgetUsed - (prev ? prev.salary_current : 0);
    pickerBlock = `
    <div class="fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50 p-2 sm:p-4" data-role="builder-picker-backdrop">

        </div>
        <div class="grid sm:grid-cols-2 gap-2">
          ${pool.map(p => playerCard(p, {
            disabled: usedWithoutSlot + p.salary_current > BUDGET,

  return `

      <button data-action="save-current" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg">💾 保存</button>
      <button data-action="go-order" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-3 py-1.5 rounded-lg">📋 推奨打順を見る</button>
    </div>
  </div>
  ${budgetBar(state.playerBudgetUsed, "残予算")}
  <div class="grid sm:grid-cols-2 gap-2 mt-4">
    ${ALL_SLOT_KEYS.map(k => builderSlotCard(k)).join("")}

  ${pickerBlock}`;

/* =========================================================
   打順提案（全モード共通）
========================================================= */
function recommendOrder(roster){
  // 能力値データがないため、年俸が高い選手ほど上位打順という単純な初期並びにする。
  // 実際の打順はプレイヤーが▲▼で自由に組み替える前提。
  const batters = BATTER_SLOT_KEYS.map(k => ({ slotKey:k, p: roster[k] })).filter(x => x.p);
  batters.sort((a, b) => b.p.salary_current - a.p.salary_current);
  return batters.map(a => a.slotKey);
}

function moveOrder(from, to){
  if (!state.battingOrder) return;
  if (to < 0 || to >= state.battingOrder.length) return;
  const arr = state.battingOrder;
  [arr[from], arr[to]] = [arr[to], arr[from]];
  saveGame(state.saveSlot, true);
  render();
}

/* =========================================================
   モード②：AI査定エンジン
========================================================= */
const KEYWORDS = [
  { pattern:/フォーム変更|新球種/,       kind:"volatility", value:1.7 },
  { pattern:/レギュラー定着|出場機会増/, kind:"volume",     value:0.07 },
  { pattern:/故障明け|リハビリ/,         kind:"downward",   value:-0.10 },
  { pattern:/移籍1年目|新天地/,          kind:"volatility", value:1.35 },
];
const KEYWORD_FLAVOR = [
  { pattern:/フォーム変更|新球種/,       text:"フォーム改造・新球種の習得が好不調の振れ幅を大きくした。" },
  { pattern:/レギュラー定着|出場機会増/, text:"出場機会の増加が数字を後押しした。" },
  { pattern:/故障明け|リハビリ/,         text:"故障からの復帰後は本来のパフォーマンスに苦しんだ場面も見られた。" },
  { pattern:/移籍1年目|新天地/,          text:"新天地での1年目は、良くも悪くも変動の大きいシーズンとなった。" },
];

function ageAdjust(age){
  if (age <= 26) return 0;
  if (age <= 30) return 0.05;
  return 0.10;
}
function classifyDelta(rel){
  if (rel > 0.25) return "breakout";
  if (rel > 0.08) return "up";
  if (rel > -0.08) return "flat";
  if (rel > -0.25) return "down";
  return "crash";
}
function raiseRateForTier(tier){
  switch(tier){
    case "breakout": return rand(0.8, 3.0);
    case "up":       return rand(0.10, 0.40);
    case "flat":     return rand(-0.05, 0.05);
    case "down":     return rand(-0.40, -0.20);
    case "crash":    return rand(-0.60, -0.50);
  }
}
function assessPlayer(p, freeText){
  const text = freeText || "";
  let volatilityMult = 1, volumeBias = 0, downwardBias = 0;
  const matched = [];
  KEYWORDS.forEach(k => {
    if (k.pattern.test(text)){
      matched.push(k);
      if (k.kind === "volatility") volatilityMult *= k.value;
      if (k.kind === "volume") volumeBias += k.value;
      if (k.kind === "downward") downwardBias += k.value;
    }
  });
  const randComponent = (Math.random() * 2 - 1) * 0.20 * volatilityMult;
  const relDelta = randComponent + volumeBias + downwardBias - ageAdjust(p.age) * 0.6;
  const tier = classifyDelta(relDelta);
  const raiseRate = raiseRateForTier(tier);
  const nextSalary = Math.max(400, Math.round(p.salary_current * (1 + raiseRate) / 100) * 100);
  const midFactor = rand(0.3, 0.65);
  const midSalary = Math.max(200, Math.round((p.salary_current + (nextSalary - p.salary_current) * midFactor) / 100) * 100);
  return { relDelta, tier, raiseRate, nextSalary, midSalary, matched };
}

const NEWS_TEMPLATES = {
  breakout: [
    (p,a) => `【号外】${p.name}選手（${p.team}）、シーズン中盤に覚醒！ ${formatMoney(p.salary_current)}→${formatMoney(a.nextSalary)}へ急上昇の見通し！`,
    (p,a) => `${p.name}選手が一気にブレイク。オフの契約更改では${formatMoney(a.nextSalary)}提示が確実視されている。`,
  ],
  up: [
    (p,a) => `${p.name}選手、着実な成長でチームに貢献。年俸は${formatMoney(p.salary_current)}→${formatMoney(a.nextSalary)}の見込み。`,
    (p,a) => `安定感を増した${p.name}選手。オフの評価は上々で${formatMoney(a.nextSalary)}前後に上積みの模様。`,
  ],
  flat: [
    (p,a) => `${p.name}選手は横ばいの1年。年俸は${formatMoney(p.salary_current)}→${formatMoney(a.nextSalary)}とほぼ変わらない見通し。`,
  ],
  down: [
    (p,a) => `${p.name}選手、不振に苦しんだシーズン。年俸は${formatMoney(p.salary_current)}→${formatMoney(a.nextSalary)}とダウン濃厚。`,
  ],
  crash: [
    (p,a) => `${p.name}選手、出場機会を大きく減らし苦しいシーズンに。年俸は${formatMoney(p.salary_current)}→${formatMoney(a.nextSalary)}と大幅ダウンの見通し。`,
  ],
};
function newsDigestFor(p, a, freeText){
  const list = NEWS_TEMPLATES[a.tier];
  const base = list[Math.floor(Math.random() * list.length)](p, a);
  const flavor = KEYWORD_FLAVOR.filter(k => k.pattern.test(freeText || "")).map(k => k.text).join(" ");
  return base + (flavor ? " " + flavor : "");
}

/* =========================================================
   結果算出
========================================================= */
function computeResults(){
  if (state.mode === "time"){
    const buildRows = (roster) => ALL_SLOT_KEYS.map(k => {
      const p = roster[k];
      return { slotKey:k, player:p, nextSalary:p.salary_past_next, raise: p.salary_past_next - p.salary_current };
    });
    const playerRows = buildRows(state.playerRoster);
    const aiRows = buildRows(state.aiRoster);
    state.resultsData = {
      mode:"time", playerRows, aiRows,
      playerTotal: playerRows.reduce((s,r) => s + r.raise, 0),
      aiTotal: aiRows.reduce((s,r) => s + r.raise, 0),
    };
  } else if (state.mode === "pennant"){
    const buildRows = (roster, isPlayer) => ALL_SLOT_KEYS.map(k => {
      const p = roster[k];
      const freeText = isPlayer ? state.freeTexts[p.id] : null;
      const a = assessPlayer(p, freeText);
      return { slotKey:k, player:p, assessment:a, nextSalary:a.nextSalary, raise: a.nextSalary - p.salary_current, digest: newsDigestFor(p, a, freeText) };
    });
    const playerRows = buildRows(state.playerRoster, true);
    const aiRows = buildRows(state.aiRoster, false);
    state.resultsData = {
      mode:"pennant", playerRows, aiRows,
      playerTotal: playerRows.reduce((s,r) => s + r.raise, 0),
      aiTotal: aiRows.reduce((s,r) => s + r.raise, 0),
    };
  }
  saveGame(state.saveSlot, true);
}

/* =========================================================
   結果画面（3タブ構成）
========================================================= */
function renderResults(){
  if (!state.resultsData) computeResults();
  const data = state.resultsData;
  const tab = state.resultsTab;
  const tabBtn = (key, label) => `<button data-action="results-tab" data-tab="${key}" class="tab-btn ${tab===key?"active":""} px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-slate-800 border border-slate-700">${label}</button>`;

  let body = "";
  if (tab === "overall") body = renderResultsOverall(data);
  else if (tab === "ranking") body = renderResultsRanking(data);
  else body = renderResultsNews(data);

  return `
  ${header(`${MODE_INFO[state.mode].label} ／ 結果発表`)}
  <div class="flex gap-2 mb-4 flex-wrap">
    ${tabBtn("overall", "総合勝敗")}
    ${tabBtn("ranking", "個別選手ランキング")}
    ${tabBtn("news", state.mode === "pennant" ? "ニュースダイジェスト" : "選手別詳細")}
  </div>
  ${body}
  <div class="mt-4 flex gap-3">
    <button data-action="go-home" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-sm">🏠 ホームに戻る</button>
  </div>`;
}

function renderResultsOverall(data){
  const win = data.playerTotal > data.aiTotal ? "player" : (data.playerTotal < data.aiTotal ? "ai" : "draw");
  const banner = win === "player"
    ? `<div class="bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 rounded-xl p-4 text-center font-black text-lg">🏆 あなたの勝利！</div>`
    : win === "ai"
    ? `<div class="bg-rose-500/15 border border-rose-500/40 text-rose-300 rounded-xl p-4 text-center font-black text-lg">😢 ライバル球団の勝利…</div>`
    : `<div class="bg-slate-700/30 border border-slate-600 rounded-xl p-4 text-center font-black text-lg">🤝 引き分け</div>`;
  return `
  ${banner}
  <div class="grid sm:grid-cols-2 gap-3 my-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 text-center">
      <div class="text-xs text-slate-400">あなたの総昇給額</div>
      <div class="text-xl sm:text-2xl font-black ${data.playerTotal>=0?"text-emerald-400":"text-rose-400"}">${formatDelta(data.playerTotal)}</div>
      <div class="text-[10px] text-slate-500 mt-1">残予算 ${formatMoney(BUDGET - state.playerBudgetUsed)}（勝敗には影響しません）</div>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 text-center">
      <div class="text-xs text-slate-400">ライバル球団の総昇給額</div>
      <div class="text-xl sm:text-2xl font-black ${data.aiTotal>=0?"text-emerald-400":"text-rose-400"}">${formatDelta(data.aiTotal)}</div>
      <div class="text-[10px] text-slate-500 mt-1">残予算 ${formatMoney(BUDGET - state.aiBudgetUsed)}（勝敗には影響しません）</div>
    </div>
  </div>
  <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3">
    <canvas id="resultBarChart" height="160"></canvas>
  </div>
  <div class="text-[11px] text-slate-500 mt-2">※選手名・所属球団・年俸は公表情報を参考にしていますが、翌年年俸はゲーム内シミュレーションによる架空の結果です。実際の契約更改とは異なります。</div>`;
}

function renderResultsRanking(data){
  const rows = [...data.playerRows.map(r => ({...r, team:"player"})), ...data.aiRows.map(r => ({...r, team:"ai"}))]
    .sort((a,b) => b.raise - a.raise);
  return `
  <div class="space-y-1.5 max-h-[60vh] overflow-y-auto pr-1">
    ${rows.map((r,i) => `
    <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg p-2">
      <div class="w-6 text-center text-xs text-slate-500 shrink-0">${i+1}</div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-bold truncate">${r.player.name} <span class="text-[10px] ${r.team==="player"?"text-sky-400":"text-rose-400"}">${r.team==="player"?"[あなた]":"[ライバル]"}</span></div>
        <div class="text-[10px] text-slate-500">${r.player.team} ／ ${SLOT_BY_KEY[r.slotKey].label} ／ ${formatMoney(r.player.salary_current)} → ${formatMoney(r.nextSalary)}</div>
      </div>
      <div class="text-sm font-black ${r.raise>=0?"text-emerald-400":"text-rose-400"} shrink-0">${formatDelta(r.raise)}</div>
    </div>`).join("")}
  </div>`;
}

function renderResultsNews(data){
  const allRows = [...data.playerRows.map(r => ({...r, team:"player"})), ...data.aiRows.map(r => ({...r, team:"ai"}))];
  if (state.mode === "pennant"){
    const selectedId = state.newsSelectedPlayerId || allRows[0].player.id;
    return `
    <div class="mb-3">
      <label class="text-xs text-slate-400 block mb-1">年俸推移チャートで見る選手</label>
      <select data-role="news-player-select" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm">
        ${allRows.map(r => `<option value="${r.player.id}" ${String(r.player.id)===String(selectedId)?"selected":""}>${r.player.name}（${r.team==="player"?"あなた":"ライバル"} ／ ${SLOT_BY_KEY[r.slotKey].label}）</option>`).join("")}
      </select>
    </div>
    <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3 mb-4">
      <canvas id="newsLineChart" height="160"></canvas>
    </div>
    <div class="space-y-2 max-h-[45vh] overflow-y-auto pr-1">
      ${allRows.map(r => `
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-3">
        <div class="text-xs ${r.team==="player"?"text-sky-400":"text-rose-400"} font-bold mb-1">${r.team==="player"?"あなたのチーム":"ライバル球団"} ／ ${SLOT_BY_KEY[r.slotKey].label} ／ ${r.player.name}</div>
        <div class="text-sm leading-relaxed">${r.digest}</div>
      </div>`).join("")}
    </div>`;
  }
  const sorted = allRows.slice().sort((a,b) => ALL_SLOT_KEYS.indexOf(a.slotKey) - ALL_SLOT_KEYS.indexOf(b.slotKey) || (a.team>b.team?1:-1));
  return `<div class="space-y-1.5 max-h-[60vh] overflow-y-auto pr-1">
    ${sorted.map(r => `
    <div class="flex items-center justify-between bg-slate-800 border border-slate-700 rounded-lg p-2 gap-2">
      <div class="text-xs">
        <span class="${r.team==="player"?"text-sky-400":"text-rose-400"} font-bold">${r.team==="player"?"あなた":"ライバル"}</span>
        ／ ${SLOT_BY_KEY[r.slotKey].label} ／ ${r.player.name}
      </div>
      <div class="text-xs text-slate-400 shrink-0">${formatMoney(r.player.salary_current)} → ${formatMoney(r.nextSalary)}</div>
    </div>`).join("")}
  </div>`;
}

/* =========================================================
   Chart.js 描画
========================================================= */
const charts = {};
function makeChart(id, config){
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (charts[id]){ charts[id].destroy(); delete charts[id]; }
  charts[id] = new Chart(canvas.getContext("2d"), config);
}
function barConfigForResults(data){
  return {
    type:"bar",
    data:{ labels:["あなた","ライバル球団"], datasets:[{ label:"総昇給額（万円）", data:[data.playerTotal, data.aiTotal], backgroundColor:["#38bdf8","#fb7185"] }] },
    options:{
      responsive:true,
      plugins:{ legend:{ display:false } },
      scales:{ y:{ ticks:{ color:"#94a3b8" }, grid:{ color:"#334155" } }, x:{ ticks:{ color:"#94a3b8" }, grid:{ display:false } } },
    },
  };
}
function lineConfigForPlayer(row){
  const p = row.player;
  const points = state.mode === "pennant"
    ? [["開幕前", p.salary_current], ["シーズン中盤", row.assessment.midSalary], ["翌年", row.nextSalary]]
    : [["開幕前", p.salary_current], ["翌年", row.nextSalary]];
  return {
    type:"line",
    data:{ labels: points.map(pt => pt[0]), datasets:[{ label:p.name + " 年俸推移（万円）", data: points.map(pt => pt[1]), borderColor:"#facc15", backgroundColor:"rgba(250,204,21,0.2)", tension:0.3, fill:true }] },
    options:{
      responsive:true,
      plugins:{ legend:{ labels:{ color:"#e2e8f0" } } },
      scales:{ y:{ ticks:{ color:"#94a3b8" }, grid:{ color:"#334155" } }, x:{ ticks:{ color:"#94a3b8" }, grid:{ display:false } } },
    },
  };
}

function afterRender(){
  if (state.screen === "results"){
    const data = state.resultsData;
    if (state.resultsTab === "overall" && document.getElementById("resultBarChart")){
      makeChart("resultBarChart", barConfigForResults(data));
    }
    if (state.resultsTab === "news" && state.mode === "pennant" && document.getElementById("newsLineChart")){
      const allRows = [...data.playerRows, ...data.aiRows];
      const selId = state.newsSelectedPlayerId || allRows[0].player.id;
      const row = allRows.find(r => String(r.player.id) === String(selId)) || allRows[0];
      makeChart("newsLineChart", lineConfigForPlayer(row));
    }
  }
}

/* =========================================================
   イベント処理（イベントデリゲーション）
========================================================= */
function startDraftFlow(){
  state.round = 1;
  state.playerRoster = freshRoster();
  state.aiRoster = freshRoster();
  state.playerBudgetUsed = 0;
  state.aiBudgetUsed = 0;
  state.draftedIds = []; syncDraftedSet();
  state.pendingPick = null;
  state.roundPlayerLocked = false;
  state.roundAiLocked = false;
  state.roundReveal = null;
  state.freeTexts = {};
  state.battingOrder = null;
  state.resultsData = null;
  state.screen = "draft";
  render();
}
function startBuilderFlow(){
  state.round = 1;
  state.playerRoster = freshRoster();
  state.aiRoster = freshRoster();
  state.playerBudgetUsed = 0;
  state.aiBudgetUsed = 0;
  state.battingOrder = null;
  state.screen = "builder";
  render();
}

document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const playerId = el.dataset.playerId ? Number(el.dataset.playerId) : null;

  switch(action){
    case "go-home":
    case "back-to-home":
      goHome();
      break;
    case "choose-mode": {
      state.mode = el.dataset.mode;
      if (state.mode === "realtime"){ startBuilderFlow(); }
      else { state.screen = "aiselect"; render(); }
      break;
    }
    case "choose-ai": {
      state.aiType = el.dataset.ai;
      startDraftFlow();
      break;
    }
    case "continue-save": {
      const slot = Number(el.dataset.slot);
      loadGame(slot);
      break;
    }
    case "delete-save": {
      const slot = Number(el.dataset.slot);
      deleteSave(slot);
      break;
    }
    case "select-candidate":
      selectCandidate(playerId);
      break;
    case "confirm-pick":
      confirmPick();
      break;
    case "advance-round":
      advanceRound();
      break;
    case "save-current":
      saveGame(state.saveSlot);
      break;
    case "go-order":
      state.battingOrder = null;
      state.screen = "order";
      render();
      break;
    case "go-results":
      state.screen = "results";
      state.resultsData = null;
      state.resultsTab = "overall";
      render();
      break;
    case "back-to-builder":
      state.screen = "builder";
      render();
      break;
    case "results-tab":
      state.resultsTab = el.dataset.tab;
      render();
      break;
    case "open-builder-slot":
      state.builderPickingSlot = el.dataset.slotKey;
      render();
      break;
    case "close-builder-picker":
      state.builderPickingSlot = null;
      render();
      break;
    case "assign-builder-player":
      assignBuilderPlayer(el.dataset.slotKey, playerId);
      break;
    case "unassign-slot-builder":
      unassignBuilderSlot(el.dataset.slotKey);
      break;
    case "order-up":
      moveOrder(Number(el.dataset.idx), Number(el.dataset.idx) - 1);
      break;
    case "order-down":
      moveOrder(Number(el.dataset.idx), Number(el.dataset.idx) + 1);
      break;
  }
});

document.body.addEventListener("click", (e) => {
  if (e.target.dataset && e.target.dataset.role === "builder-picker-backdrop"){
    state.builderPickingSlot = null;
    render();
  }
});

document.body.addEventListener("input", (e) => {
  if (e.target.matches('[data-role="free-text"]')){
    state.freeTextDraft = e.target.value;
  }
});

document.body.addEventListener("change", (e) => {
  if (e.target.matches('[data-role="news-player-select"]')){
    state.newsSelectedPlayerId = Number(e.target.value);
    const data = state.resultsData;
    if (data){
      const allRows = [...data.playerRows, ...data.aiRows];
      const row = allRows.find(r => String(r.player.id) === String(state.newsSelectedPlayerId));
      if (row) makeChart("newsLineChart", lineConfigForPlayer(row));
    }
  }
});

/* ---- ドラッグ&ドロップ（指名候補カード → 自チーム指名枠 専用） ---- */
document.body.addEventListener("dragstart", (e) => {
  const card = e.target.closest('[data-role="candidate-card"][draggable="true"]');
  if (!card) return;
  e.dataTransfer.setData("text/plain", card.dataset.playerId);
  e.dataTransfer.effectAllowed = "move";
});
document.body.addEventListener("dragover", (e) => {
  const zone = e.target.closest('[data-role="roster-slot-drop"]');
  if (!zone) return;
  e.preventDefault();
  zone.classList.add("dragover");
});
document.body.addEventListener("dragleave", (e) => {
  const zone = e.target.closest('[data-role="roster-slot-drop"]');
  if (!zone) return;
  zone.classList.remove("dragover");
});
document.body.addEventListener("drop", (e) => {
  const zone = e.target.closest('[data-role="roster-slot-drop"]');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove("dragover");
  const idStr = e.dataTransfer.getData("text/plain");
  if (!idStr) return;
  const slot = ROUND_SLOTS[state.round - 1];
  if (zone.dataset.slotKey !== slot.slotKey){
    toast("今の巡で指名できる枠にドラッグしてください", "warn");
    return;
  }
  selectCandidate(Number(idStr));
});

/* =========================================================
   起動
========================================================= */
render();
</script>
